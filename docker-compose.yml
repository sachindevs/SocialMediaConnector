version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env.local
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: node -e "require('ts-node/register'); require('./src/lib/workers/startWorkers.ts')"
    env_file: .env.local
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
